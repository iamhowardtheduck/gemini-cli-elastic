- set:
    tag: set_redaction_ok
    description: Marker for the pipeline on_failure handler - the text has been scanned (or dropped) for secrets
    field: _redaction_ok
    value: true
- script:
    description: toolCalls args -> gemini_cli.tool_input.* (command chunked for logsdb ignore_above)
    tag: extract-tool-input
    lang: painless
    if: ctx.gemini_cli?.toolCalls instanceof List
    source: |
      // Copy tool-call arguments (already redacted) into mapped, searchable fields under gemini_cli.tool_input.
      // Long commands are chunked (8000 chars, 256 overlap) because logsdb wildcard/keyword fields stop indexing at 8191.
      void addChunks(List out, String s) {
        if (s.length() <= 8000) { out.add(s); return; }
        int start = 0;
        while (start < s.length()) {
          int end = start + 8000; if (end > s.length()) { end = s.length(); }
          out.add(s.substring(start, end));
          if (end == s.length()) { break; }
          start = end - 256;
        }
      }
      void addOnce(List out, def v) { if (v instanceof String && !out.contains(v)) { out.add(v); } }
      def g = ctx.gemini_cli;
      List cmds = new ArrayList(); List files = new ArrayList(); List urls = new ArrayList(); List descs = new ArrayList(); List queries = new ArrayList();
      for (def t : g.toolCalls) {
        if (!(t instanceof Map) || !(t.args instanceof Map)) { continue; }
        def a = t.args;
        if (a.command instanceof String) { addChunks(cmds, a.command); }
        addOnce(files, a.file_path); addOnce(files, a.absolute_path); addOnce(files, a.path); addOnce(files, a.dir_path);
        if (a.paths instanceof List) { for (def p : a.paths) { addOnce(files, p); } }
        addOnce(urls, a.url);
        if (t.name == 'web_fetch' && a.prompt instanceof String) {   // web_fetch takes URLs inside its prompt
          def um = /https?:\/\/[^\s"'<>()\[\]]+/.matcher((String) a.prompt);
          while (um.find()) {
            String u = um.group();
            while (u.length() > 0 && ".,;:!?".indexOf(u.substring(u.length() - 1)) >= 0) { u = u.substring(0, u.length() - 1); }
            addOnce(urls, u);
          }
        }
        if (a.urls instanceof List) { for (def u : a.urls) { addOnce(urls, u); } }
        if (a.description instanceof String) { descs.add(a.description); }
        addOnce(queries, a.query); addOnce(queries, a.pattern);
      }
      Map ti = new HashMap();
      if (!cmds.isEmpty()) { ti.put('command', cmds); }
      if (!files.isEmpty()) { ti.put('file_path', files); }
      if (!urls.isEmpty()) { ti.put('url', urls); }
      if (!descs.isEmpty()) { ti.put('description', descs); }
      if (!queries.isEmpty()) { ti.put('query', queries); }
      if (!ti.isEmpty()) { g.tool_input = ti; } else if (g.tool_input != null) { g.remove('tool_input'); }
- pipeline:
    tag: inference
    name: '{{ IngestPipeline "inference" }}'
    description: 'Optional ML inference (integration setting ''Enable ML inference''): embedding + prompt classification'
    if: ctx.tags != null && (ctx.tags.contains('gemini_cli_embed') || ctx.tags.contains('gemini_cli_classify'))
    ignore_failure: true
- script:
    tag: drop-inference-tags
    lang: painless
    description: Remove the internal inference switch tags
    if: ctx.tags instanceof List
    source: ctx.tags.removeIf(t -> t == 'gemini_cli_embed' || t == 'gemini_cli_classify'); if (ctx.tags.isEmpty()) { ctx.remove('tags'); }
- remove:
    tag: remove_temp_fields_end
    description: Temporary fields (the inference sub-pipelines remove theirs, unless they failed)
    field:
    - _redaction_ok
    - _embed_input
    - _classify_input
    - _ml
    ignore_missing: true
on_failure:
- script:
    tag: fail_closed_on_failure
    lang: painless
    if: ctx._redaction_ok != true
    description: 'Fail closed: if the pipeline failed before secret redaction, drop the unscanned text'
    source: |
      // Fail closed: text that was not scanned for secrets is not stored.
      if (ctx.message != null) { ctx.message = '[REDACTED:redaction_failed]'; }
      def g = ctx.gemini_cli;
      if (g != null) { g.remove('content'); g.remove('toolCalls'); g.remove('thoughts'); g.remove('tool_input'); }
      if (ctx.tags instanceof List) { ctx.tags.removeIf(t -> t == 'gemini_cli_embed' || t == 'gemini_cli_classify'); } else { ctx.tags = new ArrayList(); }
      if (!ctx.tags.contains('secret_redaction_failed')) { ctx.tags.add('secret_redaction_failed'); }
- append:
    tag: append_error_message_on_failure
    field: error.message
    value: Processor '{{{ _ingest.on_failure_processor_type }}}' {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}' {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.pipeline }}}' failed with message '{{{ _ingest.on_failure_message }}}'
- set:
    tag: set_event_kind_pipeline_error
    field: event.kind
    value: pipeline_error
- append:
    tag: append_tags_preserve_original_event_on_failure
    field: tags
    value: preserve_original_event
    allow_duplicates: false
- remove:
    field:
    - _tmp
    - gemini_cli._version
    - _redaction_ok
    - _embed_input
    - _classify_input
    - _ml
    ignore_missing: true
    tag: remove_temp_fields_on_failure
